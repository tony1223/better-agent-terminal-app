name: Withdraw App Store Submission
run-name: withdraw ios ${{ inputs.versionName }}

# Cancels a review submission so the next version can be created.
#
# App Store Connect allows exactly one editable version at a time, so a version
# parked in WAITING_FOR_REVIEW holds the slot and submit-appstore.yml fails with
# "you cannot create a new version of the App in the current state" — an error
# that never says which version is in the way. Run appstore-status.yml first to
# find out, then this to clear it.
#
# Not for a version that has already passed review: one sitting in
# PENDING_DEVELOPER_RELEASE should be released, not thrown away, and the lane
# refuses that case rather than discarding a passed review.
on:
  workflow_dispatch:
    inputs:
      versionName:
        description: "Version to withdraw (must match what is actually in review)"
        required: true

jobs:
  withdraw:
    # API-only, same as submit-appstore.yml — no build, so no macOS runner.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1.3"
          bundler-cache: true

      - name: Withdraw from review
        working-directory: ios
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8_BASE64: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
          WITHDRAW_VERSION: ${{ inputs.versionName }}
          FASTLANE_SKIP_UPDATE_CHECK: "1"
        run: bundle exec fastlane ios withdraw_review
